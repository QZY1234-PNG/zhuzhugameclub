<body>
  <div class="login-screen" id="loginScreen"><div class="login-card"><div class="mark">🐷</div><h2>单子管理后台</h2><p>维护官网展示的玩法、价格与规则</p><div class="field"><label for="password">后台密码</label><input id="password" type="password" placeholder="请输入后台密码" autocomplete="current-password" /></div><div class="login-error" id="loginError"></div><button class="pink" id="loginBtn" style="width:100%">进入后台</button></div></div>

  <main class="shell">
    <div class="welcome"><div><h1>单子管理</h1><p>新增或调整内容后，前台页面会立即同步展示。</p></div><button class="pink" id="addBtn">＋ 新增单子</button></div>

    <div class="toolbar"><div class="toolbar-left"><input class="search" id="adminSearch" placeholder="搜索名称、简介或分类" /><select class="select" id="statusFilter"><option value="all">全部状态</option><option value="on">仅看上架</option><option value="off">仅看下架</option></select></div><div class="toolbar-left"><button class="outline" id="exportBtn">导出数据</button><button class="outline" id="importBtn">导入数据</button><input type="file" id="importFile" accept="application/json" class="hidden" /></div></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>单子</th><th>分类</th><th>价格</th><th>展示状态</th><th>精选</th><th>操作</th></tr></thead><tbody id="orderTable"></tbody></table></div>
    <div class="admin-note">提示：后台已接入云端数据库，保存后的单子会同步到前台；浏览器缓存仅作为临时兜底。</div>
  </main>
  <div class="editor-backdrop" id="editorBackdrop"><form class="editor" id="editorForm"><div class="editor-head"><h2 id="editorTitle">新增单子</h2><button type="button" class="close" id="closeEditor">×</button></div><div class="form-grid"><div class="field"><label>单子名称</label><input name="title" placeholder="例如：干员猎杀计划" /></div><div class="field"><label>分类</label><select name="category"><option>老板权益及须知</option><option>VIP预存</option><option>体验保底单</option><option>3×3赛季任务</option><option>陪玩单</option><option>趣味单合集</option><option>航天趣味单</option><option>巴克趣味单</option><option>监狱趣味单</option><option>礼物单</option></select></div><div class="field"><label>标签</label><input name="tag" placeholder="例如：目标挑战" /></div><div class="field"><label>价格数字（无价格可填 0）</label><input name="price" type="number" min="0" placeholder="388" /></div><div class="field"><label>价格展示文案</label><input name="priceLabel" placeholder="¥388 起 / 查看价格" /></div><div class="field"><label>封面风格</label><select name="cover"><option value="green">白菜绿</option><option value="purple">挑战紫</option><option value="orange">监狱橙</option><option value="blue">经典蓝</option><option value="pink">宝藏粉</option><option value="violet">陪玩紫</option></select></div><div class="field full"><label>卡片封面图片（4:3）</label><input id="coverImageInput" type="file" accept="image/*" /><div id="coverImagePreview" class="image-preview hidden"></div><small>建议上传 4:3 横版图片，例如 800×600。</small></div><div class="field"><label>封面图标</label><input name="emoji" placeholder="🎯" /></div><div class="field"><label>是否精选</label><select name="featured"><option value="true">是</option><option value="false">否</option></select></div><div class="field full"><label>一句话简介</label><textarea name="summary" rows="2" placeholder="简单说清楚这单怎么玩"></textarea></div><div class="field full"><label>详情图片（可选）</label><input id="imageInput" type="file" accept="image/*" /><div id="imagePreview" class="image-preview hidden"></div><small>上传后，前台点击“查看详情”会直接展示这张图片。</small></div><div class="field full"><label>规则详情</label><div class="details-list" id="detailsList"></div><button type="button" class="mini" id="addDetail">＋ 添加一条规则</button></div><div class="field"><label>展示状态</label><select name="active"><option value="true">上架</option><option value="false">下架</option></select></div></div><div class="editor-footer"><span class="editor-status" id="editorStatus"></span><button type="button" class="outline" id="cancelEditor">取消</button><button class="pink" id="saveOrderBtn" type="submit">保存单子</button></div></form></div>
  <script>

      {id:'申肖克的救赎',category:'监狱趣味单',tag:'监狱趣味单',title:'申肖克的救赎',summary:'围绕监狱主题展开多轮挑战与特殊规则。',price:208,priceLabel:'¥208 起',cover:'orange',emoji:'🔒',featured:true,active:true,details:['三局为一轮，基础保底按详情执行','撤离失败时按击杀干员类型增加任务量','最终规则以客服确认版本为准']},

    async function apiWrite(method,item){const r=await fetch(API_BASE+'/api/orders'+(method==='DELETE'?'/'+encodeURIComponent(item.id):''),{method,headers:{'content-type':'application/json','x-admin-password':adminPassword},body:method==='DELETE'?undefined:JSON.stringify(item)});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw Error(data&&data.error?data.error:'网络请求失败');return data}

    async function saveSettings(){const status=$('#settingsStatus');const button=$('#saveHeroSettings');button.disabled=true;status.className='setting-status';status.textContent='正在保存到云端…';try{const r=await fetch(API_BASE+'/api/settings',{method:'PUT',headers:{'content-type':'application/json','x-admin-password':adminPassword},body:JSON.stringify(heroSettings)});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw Error(r.status===401?'后台登录已失效，请退出后重新登录':(data&&data.error)||'网络请求失败');status.className='setting-status ok';status.textContent='保存成功，主页已同步';}catch(err){status.className='setting-status error';status.textContent='保存失败：'+(err&&err.message?err.message:'网络异常');}finally{button.disabled=false}}

    function render(){const q=$('#adminSearch').value.trim().toLowerCase();const state=$('#statusFilter').value;const list=orders.filter(o=>(state==='all'||(state==='on'?o.active!==false:o.active===false))&&(!q||`${o.title}${o.summary}${o.category}${o.tag}`.toLowerCase().includes(q)));$('#totalCount').textContent=orders.length;$('#onlineCount').textContent=orders.filter(o=>o.active!==false).length;$('#funCount').textContent=orders.filter(o=>o.category==='趣味单合集').length;$('#otherCount').textContent=orders.filter(o=>o.category!=='趣味单合集').length;$('#orderTable').innerHTML=list.length?list.map(o=>`<tr><td><div class="order-name">${esc(o.title)}</div><div class="order-sub">${esc(o.summary||'')}</div></td><td><span class="pill">${esc(o.category)}</span></td><td><b style="color:var(--pink)">${esc(o.priceLabel||'查看价格')}</b></td><td><span class="status"><i class="dot ${o.active===false?'off':''}"></i>${o.active===false?'已下架':'已上架'}</span></td><td>${o.featured?'⭐ 精选':'—'}</td><td><div class="actions"><button class="icon-btn" data-edit="${esc(o.id)}">编辑</button><button class="icon-btn" data-toggle="${esc(o.id)}">${o.active===false?'上架':'下架'}</button><button class="icon-btn delete" data-delete="${esc(o.id)}">删除</button></div></td></tr>`).join(''):`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:38px">没有匹配的单子</td></tr>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const o=orders.find(x=>x.id===b.dataset.toggle);if(o){o.active=o.active===false;save();apiWrite('PUT',o)}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这条单子吗？')){const id=b.dataset.delete;orders=orders.filter(x=>x.id!==id);save();apiWrite('DELETE',{id})}})}
    function renderCoverImagePreview(value=''){coverImageData=value||'';const box=$('#coverImagePreview');if(coverImageData){box.innerHTML=`<img src="${coverImageData}" alt="卡片封面预览" />`;box.classList.remove('hidden')}else{box.innerHTML='';box.classList.add('hidden')}}
    function renderImagePreview(value=''){imageData=value||'';const box=$('#imagePreview');if(imageData){box.innerHTML=`<img src="${imageData}" alt="详情图片预览" />`;box.classList.remove('hidden')}else{box.innerHTML='';box.classList.add('hidden')}}
    function addDetail(value=''){const row=document.createElement('div');row.className='detail-line';row.innerHTML=`<input value="${esc(value)}" placeholder="填写一条规则或须知" /><button type="button" class="mini" aria-label="删除规则">×</button>`;row.querySelector('button').onclick=()=>row.remove();$('#detailsList').appendChild(row)}
    function openEditor(id=null){editingId=id;const o=id?orders.find(x=>x.id===id):{title:'',category:'趣味单合集',tag:'',price:0,priceLabel:'查看价格',cover:'green',emoji:'🐷',featured:false,active:true,summary:'',image:'',coverImage:'',details:['']};$('#editorTitle').textContent=id?'编辑单子':'新增单子';const f=$('#editorForm');Object.entries(o).forEach(([k,v])=>{const el=f.elements[k];if(el&&el.type!=='file'){el.value=typeof v==='boolean'?String(v):v??''}});imageData=o.image||'';coverImageData=o.coverImage||'';imageReady=Promise.resolve(imageData);coverImageReady=Promise.resolve(coverImageData);$('#imageInput').value='';$('#coverImageInput').value='';renderImagePreview(imageData);renderCoverImagePreview(coverImageData);$('#editorStatus').textContent='';$('#saveOrderBtn').disabled=false;$('#saveOrderBtn').textContent='保存单子';$('#detailsList').innerHTML='';(o.details&&o.details.length?o.details:['']).forEach(addDetail);$('#editorBackdrop').classList.add('show')}
    function closeEditor(){$('#editorBackdrop').classList.remove('show')}
    $('#editorForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const title=String(fd.get('title')||'').trim();if(!title){$('#editorStatus').textContent='请先填写单子名称';return}const button=$('#saveOrderBtn');button.disabled=true;button.textContent='保存中...';$('#editorStatus').textContent='正在保存到云端';try{imageData=await imageReady;coverImageData=await coverImageReady;const item={id:editingId||title,title,category:fd.get('category'),tag:String(fd.get('tag')||'').trim()||'趣味玩法',price:Number(fd.get('price')||0),priceLabel:String(fd.get('priceLabel')||'').trim()||'查看价格',cover:fd.get('cover'),emoji:String(fd.get('emoji')||'').trim()||'🐷',featured:fd.get('featured')==='true',active:fd.get('active')==='true',summary:String(fd.get('summary')||'').trim(),image:imageData,coverImage:coverImageData,details:[...document.querySelectorAll('#detailsList input')].map(i=>i.value.trim()).filter(Boolean)};const saved=await apiWrite(editingId?'PUT':'POST',item);const finalItem=saved&&saved.id?saved:item;if(editingId){const i=orders.findIndex(x=>x.id===editingId);if(i>=0)orders[i]=finalItem}else orders.unshift(finalItem);save();$('#editorStatus').textContent='保存成功';closeEditor()}catch(err){console.error(err);$('#editorStatus').textContent='保存失败，请重试';alert('保存失败：'+(err&&err.message?err.message:'网络异常'))}finally{button.disabled=false;button.textContent='保存单子'}};async function compressImageFile(file,maxSize=1600,quality=.82){if(!file)return '';if(file.type==='image/svg+xml')return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const source=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)});const scale=Math.min(1,maxSize/Math.max(source.naturalWidth||source.width,source.naturalHeight||source.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round((source.naturalWidth||source.width)*scale));canvas.height=Math.max(1,Math.round((source.naturalHeight||source.height)*scale));canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);return await new Promise(resolve=>canvas.toBlob(blob=>{if(!blob){resolve('');return}const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(blob)},'image/jpeg',quality))}$('#imageInput').onchange=e=>{const file=e.target.files[0];if(!file)return;$('#editorStatus').textContent='正在处理详情图片...';imageReady=compressImageFile(file,1600,.82).then(value=>{renderImagePreview(value);$('#editorStatus').textContent='详情图片已准备好';return value})};$('#coverImageInput').onchange=e=>{const file=e.target.files[0];if(!file)return;$('#editorStatus').textContent='正在处理卡片封面...';coverImageReady=compressImageFile(file,1400,.82).then(value=>{renderCoverImagePreview(value);$('#editorStatus').textContent='卡片封面已准备好';return value})};bindSettingUpload('heroImageOneInput','heroImageOne');bindSettingUpload('heroImageTwoInput','heroImageTwo');bindSettingUpload('contactImageInput','contactImage');$('#saveHeroSettings').onclick=saveSettings;$('#addBtn').onclick=()=>openEditor();$('#closeEditor').onclick=closeEditor;$('#cancelEditor').onclick=closeEditor;$('#editorBackdrop').onclick=e=>{if(e.target.id==='editorBackdrop')closeEditor()};$('#addDetail').onclick=()=>addDetail();$('#adminSearch').oninput=render;$('#statusFilter').onchange=render;$('#logoutBtn').onclick=()=>{sessionStorage.removeItem('yzc_admin_login');location.reload()};$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='养猪场电竞-单子数据.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d))throw Error();orders=d.map(o=>({...o,id:o.id||o.title,active:o.active!==false}));save();d.forEach(o=>apiWrite('PUT',o));alert('导入成功')}catch{alert('导入失败：文件格式不正确')}};reader.readAsText(file)};
    async function unlock(){const password=$('#password').value;$('#loginError').textContent='正在验证...';try{const r=await fetch(API_BASE+'/api/auth',{method:'POST',headers:{'x-admin-password':password}});if(!r.ok)throw Error('密码不正确');adminPassword=password;$('#password').value='';$('#loginError').textContent='';$('#loginScreen').classList.add('hidden');render();syncFromApi();syncSettings()}catch{$('#loginError').textContent='登录失败，请检查密码或网络'}}
    $('#loginBtn').onclick=unlock;$('#password').onkeydown=e=>{if(e.key==='Enter')unlock()};render();
  </script>
</body>
